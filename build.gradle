plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.vladoose'
version = '0.0.1-SNAPSHOT'
description = 'nir2'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://jaspersoft.jfrog.io/jaspersoft/third-party-ce-artifacts/' }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // вход по Face ID / Touch ID (passkeys): WebAuthn в Spring Security 6.5.5 требует webauthn4j — ровно
    // та версия, с которой собран Spring 6.5.5 (gradle/libs.versions.toml тега 6.5.5), спека passkeys-login §1.1
    implementation 'com.webauthn4j:webauthn4j-core:0.29.5.RELEASE'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'net.sf.jasperreports:jasperreports:6.21.0'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'
    implementation 'org.apache.pdfbox:pdfbox:3.0.5'
    implementation 'org.jsoup:jsoup:1.18.1'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.icegreen:greenmail-junit5:2.1.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // ключ подписи вебхука WAHA для HTTP-тестов: так они идут в ОБЩЕМ контексте, без @TestPropertySource
    // (каждый особый контекст — ещё 10 соединений к nirdb, CLAUDE.md §14)
    systemProperty 'chats.whatsapp.waha.hmac-key', 'test-hmac-key'
}

// Детерминированное имя fat-JAR для Docker-образа (COPY build/libs/app.jar). Плейн-JAR не нужен.
tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}
tasks.named('jar') {
    enabled = false
}
