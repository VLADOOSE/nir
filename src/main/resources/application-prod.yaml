# Прод-профиль (SPRING_PROFILES_ACTIVE=prod). Секреты — из env (docker-compose/.env).
# Датасорс, почта, токены наследуются из application.yaml, но переопределяются env-переменными.
spring:
  jpa:
    show-sql: false          # прод: НЕ логируем каждый SQL (в dev было true — засоряет лог)

logging:
  level:
    org.hibernate.SQL: warn
    org.springframework.web: warn

# Вход по Face ID / Touch ID: ключи привязаны к домену прода (спека passkeys-login §5.1).
# На Tailscale и SSH-туннеле кнопки входа по ключу нет — там вход паролем.
passkeys:
  rp-id: ais.westmed.kz
  allowed-origins: https://ais.westmed.kz

# Ссылки «Открыть в АИС» в уведомлениях Telegram (спека zakup-mail-telegram §5.2).
ais:
  public-url: https://ais.westmed.kz
