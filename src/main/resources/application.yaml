spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/nirdb
    username: postgres
    password: admin

  mail:
    # DEV: MailHog — фейковый SMTP без auth, UI на http://localhost:8025
    # Запуск: docker run -d --name nir2-mailhog -p 1025:1025 -p 8025:8025 mailhog/mailhog
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:noreply@regionmed.local}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls.enable: ${MAIL_SMTP_STARTTLS:false}
          ssl.enable: ${MAIL_SMTP_SSL:false}
          # таймауты, чтобы зависший реальный SMTP (smtp.mail.ru) не держал поток отправки КП бесконечно
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  # Схема и данные — через Flyway-миграции (src/main/resources/db/migration), НЕ пересоздаются при старте.
  # Раньше schema.sql+data.sql с mode:always дропали все таблицы каждый запуск (данные слетали).
  sql:
    init:
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true   # для уже существующей боевой БД (накатывает недостающие миграции)

  jackson:
    serialization:
      fail-on-empty-beans: false

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none    # схему ведёт Flyway

  servlet:
    multipart:
      # = client_max_body_size фронта (frontend/nginx.conf) и пределу файла письма zakup@: скан КП поставщика бывает > 10 МБ;
      # больше — 400 «Файл больше 15 МБ…» (GlobalExceptionHandler.handleTooLarge, UPLOAD_LIMIT_MB)
      max-file-size: 15MB
      max-request-size: 16MB

server:
  port: 8080
  servlet:
    session:
      # «рабочий день» (спека passkeys-login §5.3): вход живёт до 12 ч с момента входа и переживает закрытие
      # браузера; было — 30 мин бездействия (умолчание Spring Boot) и cookie до закрытия браузера
      timeout: 12h
      cookie:
        max-age: 12h

# Вход по Face ID / Touch ID — passkeys (спека docs/superpowers/specs/2026-09-28-passkeys-login-design.md).
# Ключ навсегда привязан к домену rp-id: здесь — разработка (ng serve на :4200), прод — application-prod.yaml.
passkeys:
  rp-id: localhost
  allowed-origins: http://localhost:4200

mail:
  kp:
    # ящик, куда поставщики шлют ответы (Reply-To). Пусто → = spring.mail.username.
    reply-to: ${MAIL_KP_REPLY_TO:}
  # копия письма АИС — в «Отправленные» ящика отправки (IMAP APPEND): Mail.ru сам кладёт туда только письма своей
  # веб-почты. Работает, когда ящик приёма (mail.imap.*) — тот же, что ящик отправки, и задан его пароль (прод: zakup@)
  sent-copy:
    enabled: ${MAIL_SENT_COPY_ENABLED:true}
  imap:
    enabled: ${MAIL_IMAP_ENABLED:false}
    host: ${MAIL_IMAP_HOST:localhost}
    port: ${MAIL_IMAP_PORT:3143}
    username: ${MAIL_IMAP_USERNAME:zakup@westmed.kz}
    password: ${MAIL_IMAP_PASSWORD:}
    protocol: ${MAIL_IMAP_PROTOCOL:imap}
    market: ${MAIL_IMAP_MARKET:KZ}
    poll-ms: ${MAIL_IMAP_POLL_MS:60000}
    initial-delay-ms: ${MAIL_IMAP_INITIAL_DELAY_MS:20000}
    # окно ПЕРВОГО запуска (нет курсора / сменился UIDVALIDITY): письма старше не обрабатываются, дальше — курсор по UID
    since-minutes: ${MAIL_IMAP_SINCE_MINUTES:60}
    # Excel без метки [КП-…] → «Письмо клиники» (ящик info@). Для ящика закупок zakup@ — false: там это прайс поставщика
    client-requests: ${MAIL_IMAP_CLIENT_REQUESTS:true}
    # файлы ответов поставщиков (спека 2026-10-15 §3.1): больше — только имя; пусто или не число — 15, не больше 25
    max-file-mb: ${MAIL_IMAP_MAX_FILE_MB:15}
  # Письма клиентов на info@ → «Обращения» (спека docs/superpowers/specs/2026-10-13-info-mail-leads-design.md):
  # второй ящик, только чтение; «Входящие» и «Отправленные», у каждой папки свой курсор. Telegram об info@ не шлёт.
  clients:
    enabled: ${MAIL_CLIENTS_ENABLED:false}
    host: ${MAIL_CLIENTS_HOST:localhost}
    port: ${MAIL_CLIENTS_PORT:3143}
    username: ${MAIL_CLIENTS_USERNAME:info@westmed.kz}
    password: ${MAIL_CLIENTS_PASSWORD:}
    protocol: ${MAIL_CLIENTS_PROTOCOL:imap}
    market: ${MAIL_CLIENTS_MARKET:KZ}
    poll-ms: ${MAIL_CLIENTS_POLL_MS:60000}
    initial-delay-ms: ${MAIL_CLIENTS_INITIAL_DELAY_MS:30000}
    # окно ПЕРВОГО запуска папки (курсора нет / сменился UIDVALIDITY), дней; дальше — курсор по UID
    since-days: ${MAIL_CLIENTS_SINCE_DAYS:7}
    # файл письма больше предела не сохраняется — в переписке название с пометкой «откройте в почте» (не больше 100)
    max-file-mb: ${MAIL_CLIENTS_MAX_FILE_MB:25}
    # служебные домены: «2gis.ru» — сам домен и поддомены, «*.mail.ru» — только поддомены (сам mail.ru — личные ящики)
    service-domains: ${MAIL_CLIENTS_SERVICE_DOMAINS:*.mail.ru,2gis.ru,2gis.com,ecc.kz,goszakup.gov.kz}
    # Письма клиентам из АИС (спека 2026-10-19-client-mail-reply §3.1): свой SMTP info@, вход — username / password выше.
    # Пустой хост — отправка выключена. Булевы ключи в .env пустыми не оставлять (пустое значение роняет старт).
    smtp:
      host: ${MAIL_CLIENTS_SMTP_HOST:}
      port: ${MAIL_CLIENTS_SMTP_PORT:465}
      ssl: ${MAIL_CLIENTS_SMTP_SSL:true}
    from-name: ${MAIL_CLIENTS_FROM_NAME:West-Med}
    # копия письма клиенту — в «Отправленные» info@ (IMAP APPEND, как у zakup@): Mail.ru кладёт туда только письма веб-почты
    sent-copy:
      enabled: ${MAIL_CLIENTS_SENT_COPY_ENABLED:true}

# Уведомления о письмах ящика в Telegram: бот @West_Med_bot сайта, группа «Заявки», тема «Почта zakup@»
# (спека docs/superpowers/specs/2026-10-05-zakup-mail-telegram-design.md §5). Токен стоит в ПУТИ адреса Bot API —
# адреса запросов нигде не печатать.
notify:
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    api-url: ${TELEGRAM_API_URL:https://api.telegram.org}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    mail-thread-id: ${TELEGRAM_MAIL_THREAD_ID:}
    # тема «Тендеры» той же группы — новые профильные тендеры (NewTenderNotifier); пусто — «Общая»
    tenders-thread-id: ${TELEGRAM_TENDERS_THREAD_ID:}
    products-thread-id: ${TELEGRAM_PRODUCTS_THREAD_ID:}   # «Тендеры (наши товары)»; пусто — тема тендеров
    # Кнопки бота (спека 2026-10-21-tender-telegram-bot): сообщение-пачка с кнопками и приём нажатий; пустым не оставлять
    bot-actions-enabled: ${TELEGRAM_BOT_ACTIONS_ENABLED:false}

# Публичный адрес АИС — для ссылок «Открыть в АИС» в уведомлениях (прод — application-prod.yaml). Пусто — без ссылок.
ais:
  public-url: ${AIS_PUBLIC_URL:http://localhost:4200}

goszakup:
  api:
    base-url: ${GOSZAKUP_BASE_URL:https://ows.goszakup.gov.kz/v2}
    token: ${GOSZAKUP_TOKEN:}
    page-size: ${GOSZAKUP_PAGE_SIZE:50}
  import:
    since-days: ${GOSZAKUP_SINCE_DAYS:30}
    # глубина ленты: лента ~1000-3000 объявлений/сутки, 60 страниц × 50 ≈ 2-3 дня;
    # с отсечкой по since-days (страница целиком старше cutoff → стоп) можно поднимать смело
    max-pages: ${GOSZAKUP_MAX_PAGES:60}
    # пустой statuses = брать все статусы (точные id активных статусов уточняются токеном, Task 9)
    statuses: ${GOSZAKUP_STATUSES:}
    keywords: ${GOSZAKUP_KEYWORDS:узи,ультразвук,томограф,рентген,флюорограф,маммограф,монитор пациента,дефибриллятор,ивл,вентиляц,наркоз,анализатор,центрифуг,стерилизатор,автоклав,эндоскоп,гастроскоп,колоноскоп,электрокардиограф,кардиомонитор,инкубатор,облучатель,спирометр,хирургическ,реанимац,эхокардиограф,ангиограф,коагулометр,микроскоп,дефибрил,перчат,шприц,катетер,реагент,тест-систем,изделие медицинск,изделия медицинск,медицинского назначения,расходн материал,имплант,протез,стоматолог,дентальн,физиотерап}

# СК-Фармация (fms.ecc.kz) — HTML-скрейп (API у портала нет). Токен не нужен, портал открытый.
skpharmacy:
  base-url: ${SKPHARMACY_BASE_URL:https://fms.ecc.kz}
  import:
    max-pages: ${SKPHARMACY_MAX_PAGES:30}           # 10 объявлений/страница
    max-lot-pages: ${SKPHARMACY_MAX_LOT_PAGES:200}  # страниц вкладки лотов на объявление (20 лотов/стр.; 2485-лотовые бывают)
    throttle-ms: ${SKPHARMACY_THROTTLE_MS:300}      # пауза между запросами к порталу (троттлинг скрейпа от бана)

# Автозапуск импорта обеих площадок в рабочие часы и уведомление о новых профильных тендерах в Telegram
# (тема TELEGRAM_TENDERS_THREAD_ID группы «Заявки»; нужен настроенный notify.telegram). Оба выключены по умолчанию.
# Умолчания живут в коде (TenderAutoImportScheduler, NewTenderNotifier): пустое значение = умолчание.
tenders:
  auto-import:
    enabled: ${TENDERS_AUTO_IMPORT_ENABLED:false}
    # cron Spring из 6 полей; пусто — goszakup ежечасно в :10, 8–19, пн–сб; СК-Фармация в 8:40, 12:40, 16:40, пн–сб;
    # «-» выключает площадку
    goszakup-cron: ${TENDERS_AUTO_IMPORT_GOSZAKUP_CRON:}
    sk-pharmacy-cron: ${TENDERS_AUTO_IMPORT_SK_CRON:}
    zone: ${TENDERS_AUTO_IMPORT_ZONE:}        # пусто — Asia/Oral
  notify:
    enabled: ${TENDERS_NOTIFY_ENABLED:false}
    # регионы тендеров для уведомления через запятую; пусто — «Западно-Казахстанская область»; «*» — все.
    # У СК-Фармации регион — организатора («г. Астана»)
    regions: ${TENDERS_NOTIFY_REGIONS:}

# Наша продукция в тендерах по всей стране (спека 2026-10-19-product-watch): поиск лотов и объявлений goszakup по словам
# групп, планы закупок, каталог westmed.kz. Выключено по умолчанию; пустые cron — умолчания в коде
# (ProductWatchScheduler: поиск в :30 8–19 пн–сб, планы в 7:30 пн–сб, каталог в 6:00), «-» выключает задачу.
product-watch:
  enabled: ${PRODUCT_WATCH_ENABLED:false}
  cron: ${PRODUCT_WATCH_CRON:}
  plans-cron: ${PRODUCT_WATCH_PLANS_CRON:}
  catalog-cron: ${PRODUCT_WATCH_CATALOG_CRON:}
  zone: ${PRODUCT_WATCH_ZONE:}                    # пусто — Asia/Oral
  spec-per-run: ${PRODUCT_WATCH_SPEC_PER_RUN:}    # пусто — 10 ТЗ за прогон
  notify: ${PRODUCT_WATCH_NOTIFY:}                # ALL / STAR / OFF; пусто — STAR (только «★», решение оператора 2026-10-20)
  notify-min-sum: ${PRODUCT_WATCH_NOTIFY_MIN_SUM:}  # ₸, сумма наших лотов; пусто — 1000000, 0 — без порога

tender-results:
  enabled: ${TENDER_RESULTS_ENABLED:false}       # в .env пустым не оставлять — пустой булев флаг роняет старт
  cron: ${TENDER_RESULTS_CRON:}                  # пусто — ежечасно в :50, 8–20, пн–сб; «-» выключает
  digest-cron: ${TENDER_RESULTS_DIGEST_CRON:}    # пусто — 9:00, пн–сб
  market-cron: ${TENDER_RESULTS_MARKET_CRON:}    # пусто — сбор цен рынка в 7:15 ежедневно
  zone: ${TENDER_RESULTS_ZONE:}                  # пусто — Asia/Oral

ndda:
  api:
    base-url: ${NDDA_BASE_URL:https://oldregister.ndda.kz/register-backend}

# Фоновый дозаполнитель техспек лотов (очередь вокруг разбора «ТЗ»), выкл по умолчанию —
# как и остальные импорты. Пачка маленькая + пауза между лотами: площадки банят за долбёжку.
techspec:
  backfill:
    enabled: ${TECHSPEC_BACKFILL_ENABLED:false}
    batch-size: ${TECHSPEC_BACKFILL_BATCH_SIZE:10}
    throttle-ms: ${TECHSPEC_BACKFILL_THROTTLE_MS:2000}
    interval-ms: ${TECHSPEC_BACKFILL_INTERVAL_MS:600000}   # 10 минут
    # ERROR — авария внешнего мира (IP-блок, обрыв сети), а не свойство лота: через столько
    # дней сгоревшие лоты возвращаются в очередь сами. 0 — выключить возврат.
    retry-after-days: ${TECHSPEC_BACKFILL_RETRY_AFTER_DAYS:7}

# Обращения: приём заявок с сайта westmed.kz через API его админки (код сайта не меняется).
# Спека: docs/superpowers/specs/2026-09-27-leads-westmed-intake-design.md. Выкл по умолчанию, как все импорты.
leads:
  westmed:
    enabled: ${WESTMED_LEADS_ENABLED:false}
    base-url: ${WESTMED_BASE_URL:https://westmed.kz}
    site-url: ${WESTMED_SITE_URL:https://westmed.kz}     # для ссылок «на сайте ↗» у позиций
    username: ${WESTMED_USERNAME:}
    password: ${WESTMED_PASSWORD:}
    write-status: ${WESTMED_WRITE_STATUS:false}        # локально НЕ пишем статусы в боевой сайт
    market: ${WESTMED_MARKET:KZ}
    poll-ms: ${WESTMED_POLL_MS:90000}
    initial-delay-ms: ${WESTMED_INITIAL_DELAY_MS:30000}
    page-size: 50
    auth-backoff-ms: 600000                            # сайт пускает 5 входов за 5 мин с IP
    # от кого сайт шлёт письма-уведомления о заявках — приём почты их пропускает (спека §11)
    notification-from: ${WESTMED_NOTIFICATION_FROM:info@westmed.kz}

# Чаты рабочего номера WhatsApp через Green-API (спека docs/superpowers/specs/2026-09-28-whatsapp-chats-green-api-design.md).
# Выкл по умолчанию, как все интеграции. ⚠️ Очередь инстанса читает ОДИН потребитель: локальная АИС и прод —
# на РАЗНЫХ инстансах, иначе они забирают сообщения друг у друга.
chats:
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    provider: ${WHATSAPP_PROVIDER:waha}            # waha | greenapi (запасной, спека whatsapp-waha §1)
    api-url: ${WHATSAPP_API_URL:}                  # «apiUrl» из кабинета Green-API, напр. https://7105.api.greenapi.com
    id-instance: ${WHATSAPP_ID_INSTANCE:}
    api-token: ${WHATSAPP_API_TOKEN:}              # секрет: только env; стоит в пути URL — URL нигде не печатаются
    market: ${WHATSAPP_MARKET:KZ}
    max-file-mb: ${WHATSAPP_MAX_FILE_MB:25}
    receive-timeout-s: 20
    tick-ms: 1000
    initial-delay-ms: ${WHATSAPP_INITIAL_DELAY_MS:20000}
    auth-backoff-ms: 600000
    error-backoff-ms: 30000
    state-refresh-ms: 300000
    settings-refresh-ms: 3600000
    stall-ms: 300000                               # проход без продвижения дольше — «приём не продвигается» в строке
    lead-converted-days: 30
    waha:                                          # спека whatsapp-waha §11
      url: ${WHATSAPP_WAHA_URL:http://ais-waha:3000}
      api-key: ${WHATSAPP_WAHA_API_KEY:}           # секрет: только env
      hmac-key: ${WHATSAPP_WAHA_HMAC_KEY:}         # секрет: только env; подпись вебхука
      session: ${WHATSAPP_WAHA_SESSION:westmed}
      settle-ms: 3000                              # событие «отлёживается», чтобы правка не обогнала оригинал
      catch-up-ms: 600000
      catch-up-overlap-min: 10
      status-refresh-ms: 60000
      inbox-done-days: 7
      inbox-dropped-days: 30
