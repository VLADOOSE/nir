spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/nirdb
    username: postgres
    password: admin

  mail:
    # DEV: MailHog — фейковый SMTP без auth, UI на http://localhost:8025
    # Запуск: docker run -d --name nir2-mailhog -p 1025:1025 -p 8025:8025 mailhog/mailhog
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:noreply@regionmed.local}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls.enable: ${MAIL_SMTP_STARTTLS:false}
          ssl.enable: ${MAIL_SMTP_SSL:false}
          # таймауты, чтобы зависший реальный SMTP (smtp.mail.ru) не держал поток отправки КП бесконечно
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  # Схема и данные — через Flyway-миграции (src/main/resources/db/migration), НЕ пересоздаются при старте.
  # Раньше schema.sql+data.sql с mode:always дропали все таблицы каждый запуск (данные слетали).
  sql:
    init:
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true   # для уже существующей боевой БД (накатывает недостающие миграции)

  jackson:
    serialization:
      fail-on-empty-beans: false

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none    # схему ведёт Flyway

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    session:
      # «рабочий день» (спека passkeys-login §5.3): вход живёт до 12 ч с момента входа и переживает закрытие
      # браузера; было — 30 мин бездействия (умолчание Spring Boot) и cookie до закрытия браузера
      timeout: 12h
      cookie:
        max-age: 12h

# Вход по Face ID / Touch ID — passkeys (спека docs/superpowers/specs/2026-09-28-passkeys-login-design.md).
# Ключ навсегда привязан к домену rp-id: здесь — разработка (ng serve на :4200), прод — application-prod.yaml.
passkeys:
  rp-id: localhost
  allowed-origins: http://localhost:4200

mail:
  kp:
    # ящик, куда поставщики шлют ответы (Reply-To). Пусто → = spring.mail.username.
    reply-to: ${MAIL_KP_REPLY_TO:}
  imap:
    enabled: ${MAIL_IMAP_ENABLED:false}
    host: ${MAIL_IMAP_HOST:localhost}
    port: ${MAIL_IMAP_PORT:3143}
    username: ${MAIL_IMAP_USERNAME:zakup@westmed.kz}
    password: ${MAIL_IMAP_PASSWORD:}
    protocol: ${MAIL_IMAP_PROTOCOL:imap}
    market: ${MAIL_IMAP_MARKET:KZ}
    poll-ms: ${MAIL_IMAP_POLL_MS:300000}
    # обрабатывать только письма за последние N минут (не трогаем старый бэклог ящика)
    since-minutes: ${MAIL_IMAP_SINCE_MINUTES:60}

goszakup:
  api:
    base-url: ${GOSZAKUP_BASE_URL:https://ows.goszakup.gov.kz/v2}
    token: ${GOSZAKUP_TOKEN:}
    page-size: ${GOSZAKUP_PAGE_SIZE:50}
  import:
    enabled: ${GOSZAKUP_IMPORT_ENABLED:false}
    poll-ms: ${GOSZAKUP_POLL_MS:21600000}   # 6 часов
    since-days: ${GOSZAKUP_SINCE_DAYS:30}
    # глубина ленты: лента ~1000-3000 объявлений/сутки, 60 страниц × 50 ≈ 2-3 дня;
    # с отсечкой по since-days (страница целиком старше cutoff → стоп) можно поднимать смело
    max-pages: ${GOSZAKUP_MAX_PAGES:60}
    # пустой statuses = брать все статусы (точные id активных статусов уточняются токеном, Task 9)
    statuses: ${GOSZAKUP_STATUSES:}
    keywords: ${GOSZAKUP_KEYWORDS:узи,ультразвук,томограф,рентген,флюорограф,маммограф,монитор пациента,дефибриллятор,ивл,вентиляц,наркоз,анализатор,центрифуг,стерилизатор,автоклав,эндоскоп,гастроскоп,колоноскоп,электрокардиограф,кардиомонитор,инкубатор,облучатель,спирометр,хирургическ,реанимац,эхокардиограф,ангиограф,коагулометр,микроскоп,дефибрил,перчат,шприц,катетер,реагент,тест-систем,изделие медицинск,изделия медицинск,медицинского назначения,расходн материал,имплант,протез,стоматолог,дентальн,физиотерап}

# СК-Фармация (fms.ecc.kz) — HTML-скрейп (API у портала нет). Токен не нужен, портал открытый.
skpharmacy:
  base-url: ${SKPHARMACY_BASE_URL:https://fms.ecc.kz}
  import:
    enabled: ${SKPHARMACY_IMPORT_ENABLED:false}   # авто-поллинг выкл по умолчанию
    poll-ms: ${SKPHARMACY_POLL_MS:21600000}         # 6 часов
    max-pages: ${SKPHARMACY_MAX_PAGES:30}           # 10 объявлений/страница
    throttle-ms: ${SKPHARMACY_THROTTLE_MS:300}      # пауза между запросами к порталу (троттлинг скрейпа от бана)

ndda:
  api:
    base-url: ${NDDA_BASE_URL:https://oldregister.ndda.kz/register-backend}

# Фоновый дозаполнитель техспек лотов (очередь вокруг разбора «ТЗ»), выкл по умолчанию —
# как и остальные импорты. Пачка маленькая + пауза между лотами: площадки банят за долбёжку.
techspec:
  backfill:
    enabled: ${TECHSPEC_BACKFILL_ENABLED:false}
    batch-size: ${TECHSPEC_BACKFILL_BATCH_SIZE:10}
    throttle-ms: ${TECHSPEC_BACKFILL_THROTTLE_MS:2000}
    interval-ms: ${TECHSPEC_BACKFILL_INTERVAL_MS:600000}   # 10 минут
    # ERROR — авария внешнего мира (IP-блок, обрыв сети), а не свойство лота: через столько
    # дней сгоревшие лоты возвращаются в очередь сами. 0 — выключить возврат.
    retry-after-days: ${TECHSPEC_BACKFILL_RETRY_AFTER_DAYS:7}

# Обращения: приём заявок с сайта westmed.kz через API его админки (код сайта не меняется).
# Спека: docs/superpowers/specs/2026-09-27-leads-westmed-intake-design.md. Выкл по умолчанию, как все импорты.
leads:
  westmed:
    enabled: ${WESTMED_LEADS_ENABLED:false}
    base-url: ${WESTMED_BASE_URL:https://westmed.kz}
    site-url: ${WESTMED_SITE_URL:https://westmed.kz}     # для ссылок «на сайте ↗» у позиций
    username: ${WESTMED_USERNAME:}
    password: ${WESTMED_PASSWORD:}
    write-status: ${WESTMED_WRITE_STATUS:false}        # локально НЕ пишем статусы в боевой сайт
    market: ${WESTMED_MARKET:KZ}
    poll-ms: ${WESTMED_POLL_MS:90000}
    initial-delay-ms: ${WESTMED_INITIAL_DELAY_MS:30000}
    page-size: 50
    auth-backoff-ms: 600000                            # сайт пускает 5 входов за 5 мин с IP
    # от кого сайт шлёт письма-уведомления о заявках — приём почты их пропускает (спека §11)
    notification-from: ${WESTMED_NOTIFICATION_FROM:info@westmed.kz}

# Чаты рабочего номера WhatsApp через Green-API (спека docs/superpowers/specs/2026-09-28-whatsapp-chats-green-api-design.md).
# Выкл по умолчанию, как все интеграции. ⚠️ Очередь инстанса читает ОДИН потребитель: локальная АИС и прод —
# на РАЗНЫХ инстансах, иначе они забирают сообщения друг у друга.
chats:
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    api-url: ${WHATSAPP_API_URL:}                  # «apiUrl» из кабинета Green-API, напр. https://7105.api.greenapi.com
    id-instance: ${WHATSAPP_ID_INSTANCE:}
    api-token: ${WHATSAPP_API_TOKEN:}              # секрет: только env; стоит в пути URL — URL нигде не печатаются
    market: ${WHATSAPP_MARKET:KZ}
    max-file-mb: ${WHATSAPP_MAX_FILE_MB:25}
    receive-timeout-s: 20
    tick-ms: 1000
    initial-delay-ms: ${WHATSAPP_INITIAL_DELAY_MS:20000}
    auth-backoff-ms: 600000
    error-backoff-ms: 30000
    state-refresh-ms: 300000
    settings-refresh-ms: 3600000
    stall-ms: 300000                               # проход без продвижения дольше — «приём не продвигается» в строке
    lead-converted-days: 30
