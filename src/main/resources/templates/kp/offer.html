<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="utf-8"/>
  <title th:text="${doc.numberLine()}">КП</title>
  <style th:text="${pageCss}">@page { size: A4; }</style>
  <style>
    /* Документ КП (спека client-kp-constructor §6). Только CSS 2.1 — openhtmltopdf не знает flex/grid.
       Цвета — печатные (#000): это бумага, а не интерфейс АИС. */
    /* поля листа задаёт только @page (как поля страницы в Word); у body свои 8px по умолчанию — обнулены */
    body { font-family: 'Liberation Serif'; font-size: 11pt; color: #000; margin: 0; }
    table { border-collapse: collapse; }
    .lh-top { width: 100%; }
    .lh-top td { font-weight: bold; font-size: 11pt; vertical-align: top; padding: 0; }
    .lh-right { text-align: right; }
    .lh-logo { text-align: center; margin: 1mm 0; }
    .lh-logo img { max-width: 100%; max-height: 20mm; }
    .lh-brand { text-align: center; font-size: 30pt; font-weight: bold; margin: 1mm 0; }
    .lh-lines { text-align: center; font-weight: bold; font-size: 12pt; line-height: 1.25; }
    .lh-rule { border-bottom: 2.5pt solid #000; margin: 2mm 0 4mm 0; }
    .meta { width: 100%; margin-bottom: 3mm; }
    .meta td { vertical-align: top; padding: 0; }
    .meta-recipient { text-align: right; width: 50%; }
    .title { text-align: center; font-weight: bold; font-size: 13pt; margin: 2mm 0 1mm 0; }
    /* предмет и вводная — сырой текст оператора: его переводы строк (абзацы) сохраняются */
    .subject { text-align: center; font-weight: bold; font-size: 12pt; margin-bottom: 2mm; white-space: pre-line; }
    .intro { margin: 2mm 0; white-space: pre-line; }
    /* Рамки таблиц условий и позиций (0,5 pt) — в раздельной модели без промежутков: каждая черта целиком внутри своей
       ячейки (у каждой — справа и снизу, у первой в строке — слева, у шапки и первой строки условий — сверху). В модели
       collapse внешняя половина крайних черт лежит за краем таблицы, то есть за полем листа, и openhtmltopdf её срезает:
       крайние рамки выходили вдвое тоньше внутренних, так же — верх повторённой шапки на следующем листе и низ строки
       у конца листа. Обёртка .ruled отодвигает таблицы от краёв набора на KpPageGeometry.TABLE_INSET_MM (≥ точки
       предпросмотра 110 dpi): предпросмотр режет лист по целым точкам, и черта вровень с полем теряла часть точки —
       правая рамка пропадала. Доли колонок — от ширины обёртки. */
    .ruled { padding: 0 0.25mm; }
    .terms-table, .items { border-collapse: separate; border-spacing: 0; }
    .terms-table { width: 100%; margin: 2mm 0 4mm 0; }
    .terms-table td { border-right: 0.5pt solid #000; border-bottom: 0.5pt solid #000; padding: 1.2mm 1.5mm; vertical-align: top; font-size: 10.5pt; }
    .terms-table tr:first-child td { border-top: 0.5pt solid #000; }
    .terms-table td:first-child { border-left: 0.5pt solid #000; }
    .terms-table .term-label { font-weight: bold; width: 45%; }
    /* кегль таблицы — у самой таблицы (th:style, KpDocument.tableFontPt): в тесной таблице мельче, ячейки наследуют */
    .items { width: 100%; table-layout: fixed; -fs-table-paginate: paginate; margin-top: 2mm; }
    .items thead { display: table-header-group; }
    .items th, .items td { border-right: 0.5pt solid #000; border-bottom: 0.5pt solid #000; padding: 1.2mm 1.5mm; vertical-align: middle; word-wrap: break-word; }
    .items th:first-child, .items td:first-child { border-left: 0.5pt solid #000; }
    .items th { font-weight: bold; text-align: center; border-top: 0.5pt solid #000; }
    .items tr { page-break-inside: avoid; }
    .a-left { text-align: left; }
    .a-center { text-align: center; }
    .a-right { text-align: right; }
    /* деньги и короткие колонки (№, кол-во, ед. изм., ставка — KpDocument.Column.nowrap) не переносятся: ширину колонки
       под самое длинное содержимое и кегль подбирает KpDocumentBuilder.fitTable */
    .items td.nowrap { white-space: nowrap; }
    .row-section td { font-weight: bold; }
    .span-cell { text-align: center; }
    .row-section .span-cell { text-align: left; }
    .totals { margin-top: 3mm; text-align: right; }
    .totals .total-main { font-weight: bold; font-size: 12pt; }
    .words { margin-top: 2mm; }
    .terms-list { margin-top: 4mm; }
    .terms-list div { margin-bottom: 1mm; }
    /* с печатью блок получает запас снизу до низа печати — KpHtmlRenderer.signoffStyle. Отступ сверху — padding, не
       margin: блок, перенесённый page-break-inside: avoid на новый лист, с margin openhtmltopdf рисовал с печатью
       на ≈ 3,5 мм ниже, чем на первом листе (замер); с padding печать там же, где у текста */
    .signoff { padding-top: 10mm; page-break-inside: avoid; }
    /* по содержимому: линия подписи — сразу за должностью */
    .sign-table { margin-top: 1mm; }
    .sign-table td, .company-sign td { vertical-align: bottom; padding: 0; }
    .sign-line { width: 45mm; height: 15mm; border-bottom: 0.7pt solid #000; }
    .sign-table .sign-name { padding-left: 3mm; }
    .contacts { margin-top: 2mm; font-size: 10pt; }
    /* подпись и печать держатся за линию: блок во всю ячейку линии (низ блока — сама линия), картинки — от его низа.
       Без подписи директора линии нет — такой же блок (только когда есть печать) встаёт за названием компании, и строка
       названия, как строка должности, оказывается внизу под печатью. Блок во всю высоту ячейки нужен и openhtmltopdf:
       абсолютную картинку внутри прижатой книзу ячейки на перенесённом листе он сдвигал на высоту прижатия.
       Сдвиг центра печати от начала линии — KpPageGeometry.STAMP_CENTER_X_MM / STAMP_CENTER_Y_MM */
    .sign-box { position: relative; height: 15mm; }
    .sign-pic { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; }
    .sign-pic img { max-height: 15mm; max-width: 44mm; }
    .stamp { position: absolute; }
  </style>
</head>
<body>
  <table class="lh-top" th:if="${!doc.letterhead().left().isEmpty() or !doc.letterhead().right().isEmpty()}">
    <tr>
      <td><th:block th:each="l, s : ${doc.letterhead().left()}"><span th:text="${l}">слева</span><br th:unless="${s.last}"/></th:block></td>
      <td class="lh-right"><th:block th:each="l, s : ${doc.letterhead().right()}"><span th:text="${l}">справа</span><br th:unless="${s.last}"/></th:block></td>
    </tr>
  </table>
  <div class="lh-logo" th:if="${logo != null}"><img th:src="${logo}" alt=""/></div>
  <div class="lh-brand" th:if="${logo == null and doc.letterhead().brandText() != null}" th:text="${doc.letterhead().brandText()}">Бренд</div>
  <div class="lh-lines" th:if="${!doc.letterhead().lines().isEmpty()}"><th:block th:each="l, s : ${doc.letterhead().lines()}"><span th:text="${l}">строка</span><br th:unless="${s.last}"/></th:block></div>
  <div class="lh-rule"></div>

  <table class="meta">
    <tr>
      <td th:text="${doc.numberLine()}">Исх. №</td>
      <td class="meta-recipient"><th:block th:each="l, s : ${doc.recipientLines()}"><span th:text="${l}">кому</span><br th:unless="${s.last}"/></th:block></td>
    </tr>
  </table>

  <div class="title" th:text="${doc.title()}">КОММЕРЧЕСКОЕ ПРЕДЛОЖЕНИЕ</div>
  <div class="subject" th:if="${doc.subject() != null}" th:text="${doc.subject()}">предмет</div>
  <p class="intro" th:if="${doc.intro() != null}" th:text="${doc.intro()}">вводная</p>

  <div class="ruled" th:if="${!doc.termsTable().isEmpty()}"><table class="terms-table">
    <tr th:each="t : ${doc.termsTable()}">
      <td class="term-label" th:text="${t.label()}">условие</td>
      <td><th:block th:each="l, s : ${t.valueLines()}"><span th:text="${l}">значение</span><br th:unless="${s.last}"/></th:block></td>
    </tr>
  </table></div>

  <div class="ruled"><table class="items" th:style="${tableStyle}">
    <colgroup><col th:each="c : ${doc.columns()}" th:style="${'width: ' + c.percent() + '%'}"/></colgroup>
    <thead>
      <tr><th th:each="c : ${doc.columns()}" th:text="${c.label()}">колонка</th></tr>
    </thead>
    <tbody>
      <tr th:each="r : ${doc.rows()}" th:class="${r.kind().name() == 'SECTION' ? 'row-section' : (r.kind().name() == 'INCLUDED' ? 'row-included' : 'row-item')}">
        <td th:each="cell, cs : ${r.cells()}" th:class="${'a-' + #strings.toLowerCase(doc.columns()[cs.index].align().name()) + (doc.columns()[cs.index].nowrap() ? ' nowrap' : '')}"><th:block th:each="l, s : ${cell}"><span th:text="${l}">ячейка</span><br th:unless="${s.last}"/></th:block></td>
        <td class="span-cell" th:if="${r.spanFrom() < doc.columns().size()}" th:colspan="${doc.columns().size() - r.spanFrom()}"><th:block th:each="l, s : ${r.spanLines()}"><span th:text="${l}">объединено</span><br th:unless="${s.last}"/></th:block></td>
      </tr>
    </tbody>
  </table></div>

  <div class="totals">
    <div th:each="t, s : ${doc.totalLines()}" th:class="${s.first ? 'total-main' : 'total-line'}" th:text="${t}">Итого</div>
  </div>
  <div class="words" th:if="${doc.amountInWords() != null}" th:text="${doc.amountInWords()}">прописью</div>

  <div class="terms-list" th:if="${!doc.termsList().isEmpty()}">
    <div th:each="t : ${doc.termsList()}" th:text="${t}">1. условие</div>
  </div>

  <div class="signoff" th:style="${signoffStyle}">
    <div>С уважением,</div>
    <table class="sign-table" th:if="${doc.signoff().director()}">
      <tr>
        <td th:text="${doc.signoff().titleLine()}">Директор</td>
        <td class="sign-line"><div class="sign-box"><div class="sign-pic" th:if="${signature != null}"><img th:src="${signature}" alt=""/></div><img class="stamp" th:if="${stamp != null}" th:src="${stamp}" th:style="${stampStyle}" alt=""/></div></td>
        <td class="sign-name" th:text="${doc.signoff().nameLine()}">Фамилия И. О.</td>
      </tr>
    </table>
    <table class="company-sign" th:unless="${doc.signoff().director()}">
      <tr>
        <td th:text="${doc.signoff().titleLine()}">ТОО</td>
        <td><div class="sign-box" th:if="${stamp != null}"><img class="stamp" th:src="${stamp}" th:style="${stampStyle}" alt=""/></div></td>
      </tr>
    </table>
    <div class="contacts" th:if="${doc.signoff().contacts() != null}" th:text="${doc.signoff().contacts()}">контакты</div>
  </div>
</body>
</html>
