<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>АИС Медзакупки</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- PWA: установка на домашний экран (iOS/Android), запуск без адресной строки Safari -->
  <meta name="theme-color" content="#1e3a8a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="АИС">

  <!-- анти-FOUC: ставим тему до первого рендера (иначе мигает светлым) -->
  <script>
    (function(){try{var k='ais.theme',v=localStorage.getItem(k);
      if(v!=='dark'&&v!=='light')v=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
      document.documentElement.setAttribute('data-theme',v);}catch(e){}})();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
